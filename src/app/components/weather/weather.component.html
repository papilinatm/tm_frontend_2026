
<mat-slide-toggle [checked]="isWeek()" #st (change)="changeForecast(st.checked)">Week Forecast</mat-slide-toggle>
<div class="card highlight-card">

@if (isWeek()) {
  <div>
    @for (f of weekForecast(); track f.date) {
      <app-one-day [f]="f"></app-one-day>
    }
  </div>
} @else {
   @if (dayForecast()) {
      <app-one-day [f]="dayForecast()"></app-one-day> 
    } 
  }
</div>
